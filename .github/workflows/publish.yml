name: Plugins - CD
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options:
          - 'dev'
          - 'ops'
          - 'prod-canary'
          - 'prod'
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean
      append-commit-suffix:
        description: Append commit SHA to version (uncheck to publish the exact version, e.g. final validation before prod)
        default: true
        type: boolean

permissions: {}

jobs:
  check-changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Verify CHANGELOG.md has no [Unreleased] section
        run: |
          UNRELEASED_LINE=$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
          RELEASE_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -1 | cut -d: -f1)

          # No [Unreleased] section — nothing to check
          if [ -z "$UNRELEASED_LINE" ]; then
            exit 0
          fi

          # [Unreleased] is below the latest release — fine
          if [ -n "$RELEASE_LINE" ] && [ "$UNRELEASED_LINE" -gt "$RELEASE_LINE" ]; then
            exit 0
          fi

          VERSION=$(jq -r '.version' package.json)
          echo "Error: CHANGELOG.md contains an [Unreleased] section."
          echo "A released version is required and must match package.json (${VERSION})."
          exit 1

  cd:
    name: CD
    needs: check-changelog
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v10.2.0
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    with:
      branch: ${{ github.event.inputs.branch }}
      environment: ${{ github.event.inputs.environment }}
      plugin-version-suffix: >-
        ${{
          (github.event.inputs.environment != 'prod' && github.event.inputs.append-commit-suffix == 'true')
          && github.sha || ''
        }}
      docs-only: ${{ fromJSON(github.event.inputs.docs-only) }}
      scopes: universal
      grafana-cloud-deployment-type: provisioned
      trigger-argo: ${{ github.event.inputs.environment != 'none' }}
      argo-workflow-slack-channel: "#grafana-dataviz-squad"
      attestation: true
      run-playwright: false
