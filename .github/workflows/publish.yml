name: Plugins - CD
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options:
          - 'dev'
          - 'ops'
          - 'prod-canary'
          - 'prod'
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean

permissions: {}

jobs:
  check-changelog:
    name: Check changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Verify CHANGELOG.md has no [Unreleased] section
        run: |
          UNRELEASED_LINE=$(grep -n "^## \[Unreleased\]" CHANGELOG.md | head -1 | cut -d: -f1)
          RELEASE_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -1 | cut -d: -f1)

          # No [Unreleased] section — nothing to check
          if [ -z "$UNRELEASED_LINE" ]; then
            exit 0
          fi

          # [Unreleased] is below the latest release — fine
          if [ -n "$RELEASE_LINE" ] && [ "$UNRELEASED_LINE" -gt "$RELEASE_LINE" ]; then
            exit 0
          fi

          VERSION=$(jq -r '.version' package.json)
          echo "Error: CHANGELOG.md contains an [Unreleased] section."
          echo "A released version is required and must match package.json (${VERSION})."
          exit 1

  cd:
    name: CD
    needs: check-changelog
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v10.2.0
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    with:
      branch: ${{ github.event.inputs.branch }}
      environment: ${{ github.event.inputs.environment }}
      # plugin-version-suffix is intentionally unset: cd.yml already appends the
      # head commit SHA for non-release references and leaves release references
      # (e.g. main at a tagged version) with the exact plugin.json version.
      docs-only: ${{ fromJSON(github.event.inputs.docs-only) }}
      scopes: universal
      # Only fan out to Grafana Cloud from main. Dispatching a PR branch to dev
      # publishes to the catalog for stack overrides without deploying it everywhere.
      trigger-argo: ${{ github.event.inputs.branch == 'main' }}
      auto-merge-environments: dev
      # Route prod and prod-canary deploys to their own channel. Quoted because
      # YAML would otherwise treat " #" as the start of a comment.
      argo-workflow-slack-channel: "${{ startsWith(github.event.inputs.environment, 'prod') && '#dataviz-cd-alerts-prod' || '#dataviz-cd-alerts-dev-ops' }}"
      grafana-cloud-deployment-type: provisioned
      attestation: true
      # Keep the e2e setup in sync with push.yml (CI): the CD run must gate on the
      # same Playwright suite that gated the change into main.
      run-playwright: false
      run-playwright-docker: true
      playwright-docker-compose-file: docker-compose.yaml
      run-playwright-with-grafana-dependency: '>=13.2.0'
      upload-playwright-artifacts: true
      # Anonymous auth is disabled for e2e, so "/" 302-redirects to the login
      # page. The readiness check requires a 200, so point it at /login.
      playwright-grafana-url: http://localhost:3000/login
