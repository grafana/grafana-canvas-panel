name: Plugins - CI / CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs on PRs only. Pushes to main publish to the catalog and
# trigger an Argo deployment, so cancelling one mid-flight can leave a published
# version with no corresponding deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Independent of the reusable CI workflow below — just guards against the
  # Playwright version drifting between package.json and the Docker e2e setup.
  playwright-version-sync:
    name: Verify Playwright version sync
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Playwright container version is in sync
        run: |
          PKG_VERSION=$(jq -r '.devDependencies["@playwright/test"]' package.json)
          DOCKERFILE_VERSION=$(sed -n 's/^ARG PLAYWRIGHT_VERSION=//p' e2e/Dockerfile.playwright | head -1)
          COMPOSE_VERSION=$(sed -n 's/.*PLAYWRIGHT_VERSION:-\([0-9.]*\)}.*/\1/p' docker-compose.yaml | head -1)
          echo "package.json:      $PKG_VERSION"
          echo "Dockerfile ARG:    $DOCKERFILE_VERSION"
          echo "compose default:   $COMPOSE_VERSION"
          if [ "$PKG_VERSION" != "$DOCKERFILE_VERSION" ] || [ "$PKG_VERSION" != "$COMPOSE_VERSION" ]; then
            echo "::error::Playwright version mismatch. Update the PLAYWRIGHT_VERSION fallback defaults in e2e/Dockerfile.playwright and docker-compose.yaml to match @playwright/test in package.json ($PKG_VERSION)."
            exit 1
          fi

  # Pull requests call ci.yml directly: they test and build, and publish nothing.
  # Reporting them through cd.yml would prefix every check with the calling job's
  # name, so a PR would read "CD / CI / Test and build plugin" despite deploying
  # nothing. Keeping the two paths in separate jobs makes the check names honest.
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    # The container derives both its base image and its @playwright/test install
    # from PLAYWRIGHT_VERSION, so drift from package.json is internally
    # consistent and e2e won't fail on its own. Gate on the guard so a drifted
    # commit can't merge having tested the wrong version.
    needs: playwright-version-sync
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.2.0
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      plugin-version-suffix: ${{ github.event.pull_request.head.sha }}
      run-playwright: false
      run-playwright-docker: true
      playwright-docker-compose-file: docker-compose.yaml
      run-playwright-with-grafana-dependency: '>=13.2.0'
      # Nightly runs on OSS in the ci-nightly job below.
      run-playwright-with-skip-grafana-nightly-image: true
      upload-playwright-artifacts: true
      # Anonymous auth is disabled for e2e, so "/" 302-redirects to the login
      # page. The readiness check requires a 200, so point it at /login.
      playwright-grafana-url: http://localhost:3000/login

  # The reusable workflow's version matrix always uses grafana-enterprise
  # images, and grafana-enterprise:nightly is no longer updated. This job runs
  # only the nightly entry, through a compose file that forces the OSS image.
  # The impossible dependency range matches no stable version, leaving only
  # nightly in the matrix.
  ci-nightly:
    name: CI (OSS nightly)
    if: github.event_name == 'pull_request'
    # ci.yml's concurrency group is keyed only on plugin-directory and the PR
    # branch, with cancel-in-progress, so two parallel calls cancel each other.
    # Running after ci also guarantees its dist-artifacts upload exists: the
    # Dockerized e2e job always downloads "dist-artifacts" by that fixed name.
    needs: [playwright-version-sync, ci]
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.2.0
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    with:
      plugin-version-suffix: ${{ github.event.pull_request.head.sha }}
      run-playwright: false
      run-playwright-docker: true
      playwright-docker-compose-file: docker-compose.oss.yaml
      # This job's own build would otherwise clash with ci's artifact name.
      dist-artifacts-prefix: oss-nightly-
      run-playwright-with-grafana-dependency: '>=99.0.0'
      upload-playwright-artifacts: true
      playwright-grafana-url: http://localhost:3000/login

  # TEMPORARY: remove once ci-nightly passes. The reusable e2e workflow never
  # prints container logs, so this starts the same OSS nightly stack on the
  # same runner type and dumps them.
  debug-oss-nightly:
    name: Debug OSS nightly startup
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-x64-large
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: dist-artifacts
          path: /tmp/dist-artifacts

      - name: Unpack dist
        run: |
          ls -la /tmp/dist-artifacts
          zip=$(ls /tmp/dist-artifacts/*.zip | grep -vE 'linux|darwin|windows|any' | head -1)
          unzip -q "$zip" -d /tmp/out
          mkdir -p dist
          mv /tmp/out/*/* dist/
          ls dist | head

      - name: Start Grafana
        run: |
          docker compose version
          GRAFANA_VERSION=nightly GRAFANA_IMAGE=grafana-enterprise docker compose -f docker-compose.oss.yaml up -d

      - name: Poll /login
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            echo "t=${i}s status=${code}"
            [ "$code" = 200 ] && exit 0
            sleep 1
          done
          exit 1

      - name: Dump container state
        if: always()
        run: |
          docker compose -f docker-compose.oss.yaml ps -a
          docker inspect grafana-canvas-panel --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} ports={{json .NetworkSettings.Ports}}'
          docker compose -f docker-compose.oss.yaml logs --no-color grafana | grep -vE 'level=debug' | tail -300

  # Pushes to main publish to the dev and ops catalogs and deploy to Grafana Cloud via
  # Argo. cd.yml calls ci.yml internally, so the build and e2e suite still run
  # ahead of the publish. The Argo / catalog inputs exist only on cd.yml.
  cd:
    # Deliberately not "CD (dev)": this job name is the required-status-check
    # context, so it must stay stable even if the environment input changes.
    name: CD
    if: github.event_name == 'push'
    needs: playwright-version-sync
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v10.2.0
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    with:
      branch: ${{ github.ref_name }}
      environment: dev,ops
      plugin-version-suffix: ${{ github.sha }}
      scopes: universal
      grafana-cloud-deployment-type: provisioned
      auto-merge-environments: dev,ops
      # This job only targets dev and ops (see the environment input above). Prod deploys
      # stay manual through publish.yml.
      argo-workflow-slack-channel: "#grafana-dataviz-feed-cd-dev-ops"
      argo-workflow-slack-silent: true
      run-playwright: false
      run-playwright-docker: true
      playwright-docker-compose-file: docker-compose.yaml
      run-playwright-with-grafana-dependency: '>=13.2.0'
      # Nightly runs on OSS in the ci-nightly job below.
      run-playwright-with-skip-grafana-nightly-image: true
      upload-playwright-artifacts: true
      playwright-grafana-url: http://localhost:3000/login
