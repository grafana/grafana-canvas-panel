services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # e2e logs in as admin and edits panels, so anonymous access must be
        # off. The reusable e2e workflow doesn't set ANONYMOUS_AUTH_ENABLED,
        # and the base compose file defaults it to true, so pin it here.
        anonymous_auth_enabled: false
    ports:
      - '3000:3000'

  playwright:
    container_name: playwright-e2e
    build:
      dockerfile: ./e2e/Dockerfile.playwright
      context: .
      args:
        # Kept in sync with @playwright/test in package.json via the e2e npm script.
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
    volumes:
      - ./provisioning:/app/provisioning
      - ./e2e:/app/e2e
      - ./test-results:/app/test-results
      - ./playwright:/app/playwright
      - ./playwright-report:/app/playwright-report
      - ./playwright.config.ts:/app/playwright.config.ts:ro
      - ./package.json:/app/package.json:ro
    profiles: [playwright]
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_URL: http://grafana:3000
      PW_TEST_HTML_REPORT_OPEN: never
    ports:
      - '9323:9323'

networks:
  default:
    name: grafana-canvas-panel_default
