services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        # e2e logs in as admin and edits panels, so anonymous access must be
        # off. The reusable e2e workflow doesn't set ANONYMOUS_AUTH_ENABLED,
        # and the base compose file defaults it to true, so pin it here.
        anonymous_auth_enabled: false
    # Override the base container_name so multiple instances don't clash.
    # Setting only GRAFANA_PORT is enough; with neither set the name stays
    # grafana-canvas-panel.
    container_name: ${GRAFANA_CONTAINER_NAME:-grafana-canvas-panel${GRAFANA_PORT:+-$GRAFANA_PORT}}
    # Grafana only maps GF_* env vars onto ini sections that already exist, and
    # [plugin.canvas] isn't in defaults.ini, so GF_PLUGIN_CANVAS_AS_EXTERNAL is
    # ignored. Instead, copy the image's grafana.ini, append the section at
    # startup, and point Grafana at the copy.
    # Defaults to true so e2e (including the reusable CI workflow, which can't
    # pass extra env vars) tests this repo's build rather than the core panel.
    # Set CANVAS_AS_EXTERNAL=false to run against the core implementation.
    environment:
      CANVAS_AS_EXTERNAL: ${CANVAS_AS_EXTERNAL:-true}
      GF_PATHS_CONFIG: /tmp/custom.ini
      # Browsers scope cookies by host, not port, so instances on localhost
      # would overwrite each other's session cookie. Name it per port.
      GF_AUTH_LOGIN_COOKIE_NAME: grafana_session_${GRAFANA_PORT:-3000}
      # Pass through from the shell, e.g. GF_FEATURE_TOGGLES_ENABLE=foo npm run server
      GF_FEATURE_TOGGLES_ENABLE: ${GF_FEATURE_TOGGLES_ENABLE:-}
    entrypoint:
      - sh
      - -c
      - |
        cp /etc/grafana/grafana.ini /tmp/custom.ini
        printf '\n[plugin.canvas]\nas_external = %s\n' "$$CANVAS_AS_EXTERNAL" >> /tmp/custom.ini
        exec /entrypoint.sh
    ports: !override
      - ${GRAFANA_PORT:-3000}:3000/tcp

  playwright:
    container_name: playwright-e2e
    build:
      dockerfile: ./e2e/Dockerfile.playwright
      context: .
      args:
        # Kept in sync with @playwright/test in package.json via the e2e npm script.
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
    volumes:
      - ./provisioning:/app/provisioning
      - ./e2e:/app/e2e
      - ./tests:/app/tests
      - ./test-results:/app/test-results
      - ./playwright:/app/playwright
      - ./playwright-report:/app/playwright-report
      - ./playwright.config.ts:/app/playwright.config.ts:ro
      - ./package.json:/app/package.json:ro
    profiles: [playwright]
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      GRAFANA_URL: http://grafana:3000
      # Must match the grafana service so specs pick the right panel name.
      CANVAS_AS_EXTERNAL: ${CANVAS_AS_EXTERNAL:-true}
      PW_TEST_HTML_REPORT_OPEN: never
    ports:
      - '9323:9323'

networks:
  default:
    # Scoped per compose project so parallel instances get separate networks.
    name: ${COMPOSE_PROJECT_NAME:-grafana-canvas-panel}_default
